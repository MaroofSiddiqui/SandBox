spring.application.name=assessment-service

server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/sandbox_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=cdac
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ============================================================
# JWT CONFIGURATION
# ============================================================

# IMPORTANT:
# Assessment Service must use the SAME JWT secret
# as Auth Service because Auth signs the token
# and Assessment will verify that signature.

app.jwt.secret=${JWT_SECRET}