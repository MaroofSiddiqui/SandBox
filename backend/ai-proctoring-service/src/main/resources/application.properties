spring.application.name=ai-proctoring-service

# ==============================
# SERVER
# ==============================
server.port=8083

# ==============================
# MONGODB
# ==============================
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=ai_proctoring_db

# ==============================
# MYSQL - SHARED WITH AUTH
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/sandbox_db
spring.datasource.username=root
spring.datasource.password=cdac
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JUDGE0
# ==============================
judge0.api.host=https://judge0-ce.p.rapidapi.com
judge0.api.key=${JUDGE0_API_KEY}

# ==============================
# GEMINI
# ==============================
gemini.api.key=${GEMINI_API_KEY}

# ==============================
# FILE UPLOAD
# ==============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ==============================
# JWT CONFIGURATION
# ==============================

# Must be the SAME JWT secret used by auth-service
app.jwt.secret=${JWT_SECRET}

# ==============================
# ASSESSMENT SERVICE
# ==============================
assessment.service.url=http://localhost:8082